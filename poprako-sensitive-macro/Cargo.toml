[package]
name = "poprako-sensitive-macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Derive macros for poprako-sensitive formatting and redaction"
documentation = "https://docs.rs/poprako-sensitive-macro"
readme = "README.md"
keywords = ["redaction", "sensitive", "debug", "logging", "derive"]
categories = ["development-tools::procedural-macro-helpers"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full"] }
