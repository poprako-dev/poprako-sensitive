[workspace]
members = [".", "poprako-sensitive-macro"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/poprako-dev/poprako-sensitive"
publish = false

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
indexing_slicing = "deny"
string_slice = "deny"
mod_module_files = "deny"
allow_attributes_without_reason = "deny"

[package]
name = "poprako-sensitive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Compile-time sensitive value formatting with custom redaction callbacks"
documentation = "https://docs.rs/poprako-sensitive"
readme = "README.md"
keywords = ["redaction", "sensitive", "debug", "logging", "derive"]
categories = ["development-tools::debugging", "rust-patterns"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[lints]
workspace = true

[dependencies]
poprako-sensitive-macro = { version = "0.1.0", path = "poprako-sensitive-macro" }

[package.metadata.docs.rs]
all-features = true
